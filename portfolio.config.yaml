# ── About ──────────────────────────────────────────────────────────────
about: |
  Profissional com 8+ anos de experiencia em operacoes tecnicas de alta 
  complexidade na Nestle, combinando expertise em manutencao industrial 
  com desenvolvimento de solucoes em dados, automacao e business intelligence.

  Desenvolvo aplicacoes proprias em Python e Streamlit, consultas SQL 
  avancadas (VIEWS, PROCEDURES, CTEs) e dashboards em Power BI para 
  otimizar processos operacionais do dia a dia — desde controle de estoque 
  ate ferramentas que reduzem em 80% o tempo de tarefas manuais em campo.

  Formado em Analise e Desenvolvimento de Sistemas (UVA) e Tecnico em 
  Eletrotecnica (Faetec). Referencia tecnica no Rio de Janeiro para 
  equipamentos de alta complexidade.

