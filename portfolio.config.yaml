# ── About ──────────────────────────────────────────────────────────────
about: |
  Técnico de Manutenção Sênior com 8+ anos na Nestlé, referência técnica no 
  Rio de Janeiro e único profissional da equipe com formação em eletrotécnica.
  
  Especialista em equipamentos de alta complexidade (máquinas de café, sistemas 
  técnicos). Conhecimento profundo de toda a frota de equipamentos da operação.
  
  Desenvolvo soluções próprias em SQL, Python e Power BI para automatizar 
  processos operacionais do dia a dia — desde controle de peças até apps 
  que aceleram o trabalho em campo. Portfólio com projetos aplicados a 
  cenários reais de manutenção industrial.
  
  Disponível para oportunidades que unam dados, processos e tecnologia.

